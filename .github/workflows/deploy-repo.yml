# This workflow is triggered by the hitokoto-cli repository on release.
# It downloads the Termux .deb artifacts built by hitokoto-cli CI,
# generates the APT repository structure with termux-apt-repo,
# and deploys it to GitHub Pages (gh-pages branch).
name: Deploy Termux APT Repo

on:
  # Triggered by another repository (hitokoto-cli CI) via repository_dispatch
  repository_dispatch:
    types: [deploy-termux-debs]
  # Also supports manual trigger (requires hitokoto-cli CI run ID)
  workflow_dispatch:
    inputs:
      run_id:
        description: 'hitokoto-cli CI run ID that produced the deb artifacts'
        required: true
        type: string

permissions:
  contents: write
  pages: write

jobs:
  build-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download deb artifacts from hitokoto-cli CI
        uses: actions/download-artifact@v4
        with:
          repository: xiSage/hitokoto-cli
          run-id: ${{ github.event.client_payload.run_id || inputs.run_id }}
          github-token: ${{ secrets.REPO_ACCESS_TOKEN }}
          path: ./debs-all

      - name: Collect Termux .deb files
        shell: bash
        run: |
          mkdir -p ./debs
          # Extract Termux deb files from all downloaded artifacts
          find ./debs-all -name '*termux*.deb' -exec cp {} ./debs/ \; 2>/dev/null || true
          echo "=== Collected deb files ==="
          ls -la ./debs/
          if [ -z "$(ls -A ./debs/*.deb 2>/dev/null)" ]; then
            echo "ERROR: No .deb files found"
            exit 1
          fi

      - name: Install termux-apt-repo
        run: pip install termux-apt-repo

      - name: Build APT repo
        run: |
          # Generate APT repository structure into ./repo-output
          # stable = distribution name, main = component name
          termux-apt-repo ./debs ./repo-output stable main

          # Keep .nojekyll (disable Jekyll)
          cp .nojekyll ./repo-output/ 2>/dev/null || touch ./repo-output/.nojekyll

          # Keep README.md
          cp README.md ./repo-output/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo-output
          # Deploy to gh-pages branch
          publish_branch: gh-pages
